<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact page</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <nav class="navbar md:navbar-expand bg-1 fg-2">
        <div class="container-fluid">
            <a class="navbar-brand fg-black" href="#">Sweet Corner</a>
            <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>
            <dialog class="drawer drawer-end" tabindex="-1" id="navbarNav" aria-labelledby="navbarNavLabel">
                <div class="drawer-header">
                    <h5 class="drawer-title fg-black" id="navbarNavLabel">Menu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                </div>
                <div class="drawer-body">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active fg-black" aria-current="page" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link fg-black" href="#">Our Desserts</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link fg-black" href="contact.html">Contact Us</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link disabled fg-black" aria-disabled="true">Disabled</a>
                        </li>
                    </ul>
                </div>
            </dialog>
        </div>
    </nav>


    <div class="container mt-5">
        <H1>Contact Us</H1>
        <form style="max-width: 950px; margin:0px auto">
            <div class="row g-4">

                <div class="md:col-6">
                    <div class="form-field mb-3">
                        <label for="firstname" class="form-label">First Name</label>
                        <input type="text" class="form-control" id="firstname">
                    </div>
                </div>

                <div class="md:col-6">
                    <div class="form-field mb-3">
                        <label for="lastname" class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="lastname">
                    </div>
                </div>

                 <div class="md:col-6">
                    <div class="form-field mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" placeholder="name@example.com">
                        <div class="form-text">
                            We'll never share your email with anyone else.
                        </div>
                    </div>
                 </div>

                 <div class="md:col-6">
                    <div class="form-field mb-3">
                        <label for="gender" class="form-label">Inquiry Type</label>
                        <select class="form-control" id="gender">
                            <option>Inquiry Type</option>
                            <option value="1">General Inquiry</option>
                            <option value="2">Custom Cake Order</option>
                            <option value="3">Feedback</option>
                        </select>
                    </div>
                 </div>

                  <div class="md:col-6">
                    <div class="form-field mb-3">
                        <label for="comments" class="form-label">Comments</label>
                        <textarea class="form-control" id="comments"></textarea>
                    </div>
                  </div>

                  <div class="md:col-6">
                    <div class="form-field mb-3 md:mt-5 md:pt-5">
                        <input type="checkbox" id="checkLabel" class="check" />
                        <label for="checkLabel">I agree to be contacted about my inquiry.</label>
                    </div>
                  </div>
            </div>
            <button type="submit" class="btn-solid theme-primary">Submit</button>
        </form>
    </div>

    <div class="container mt-5">
        <p class="p-3 d-flex justify-content-center">
            &copy; 2026 Student Showcase
        </p>
    </div>
</body>
</html>
